<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradient for Shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Outer Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="coreFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M 50 5 
           C 68 5, 86 11, 88 19 
           C 90 43, 85 71, 50 95 
           C 15 71, 10 43, 12 19 
           C 14 11, 32 5, 50 5 Z" 
        fill="url(#shieldGrad)" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        filter="url(#softGlow)" />

  <!-- Shield Inner Border Highlight -->
  <path d="M 50 10 
           C 65 10, 80 15, 82 22 
           C 84 42, 79 67, 50 89 
           C 21 67, 16 42, 18 22 
           C 20 15, 35 10, 50 10 Z" 
        fill="none" 
        stroke="#FECDD3" 
        stroke-width="1.2" 
        stroke-opacity="0.6"/>

  <!-- Outer Stylized Fire Flame -->
  <path d="M 50 20 
           C 54 27, 62 32, 66 39 
           C 71 47, 70 58, 63 65 
           C 58 70, 52 72, 47 72 
           C 40 72, 34 68, 32 62 
           C 30 55, 33 49, 38 45 
           C 35 48, 36 53, 40 55 
           C 42 56, 46 55, 47 51 
           C 49 45, 45 39, 44 33 
           C 43 27, 47 22, 50 20 Z" 
        fill="url(#flameGrad)" />

  <!-- Inner Bright Fire Core -->
  <path d="M 50 33 
           C 53 39, 58 43, 59 48 
           C 60 54, 56 60, 51 62 
           C 47 63, 44 62, 42 59 
           C 40 55, 43 52, 46 50 
           C 47 45, 45 40, 50 33 Z" 
        fill="url(#coreFlameGrad)" />

  <!-- Central Pocika "P" Safety Monogram -->
  <g id="pocika-p-emblem">
    <!-- P Outer Stem & Loop in Clean White -->
    <path d="M 41 35 L 53 35 C 59.5 35, 64 38.5, 64 44.5 C 64 50.5, 59.5 54, 53 54 L 46.5 54 L 46.5 68 L 41 68 Z" 
          fill="#FFFFFF" />
    <!-- P Inner Negative Cutout in Flame Red -->
    <path d="M 46.5 40 L 52.5 40 C 55.5 40, 58 41.8, 58 44.5 C 58 47.2, 55.5 49, 52.5 49 L 46.5 49 Z" 
          fill="#DC2626" />
  </g>
</svg>
